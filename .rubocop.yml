AllCops:
  NewCops: enable
  TargetRubyVersion: 3.1
  SuggestExtensions: false

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/FetchEnvVar:
  Enabled: false

Layout/LineLength:
  Exclude:
    - "*.gemspec"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Metrics:
  Enabled: false
